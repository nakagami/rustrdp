<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rdpwasm – WebAssembly RDP Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e1e; color: #ccc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h1 { margin-bottom: 16px; color: #fff; }
    form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
    input { padding: 6px 10px; border: 1px solid #555; background: #2d2d2d; color: #eee; border-radius: 4px; }
    button { padding: 6px 16px; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0055bb; }
    #status { margin-bottom: 8px; font-size: 0.9em; color: #aaa; min-height: 1.2em; }
    #status.error { color: #f88; }
    #status.ok { color: #8f8; }
    canvas { border: 1px solid #444; background: #000; cursor: crosshair; }
  </style>
</head>
<body>
  <h1>rdpwasm</h1>
  <form id="connect-form">
    <input id="host"   type="text"     placeholder="RDP host"  value="localhost" />
    <input id="port"   type="number"   placeholder="Port"      value="3389" />
    <input id="user"   type="text"     placeholder="Username"  value="" />
    <input id="pass"   type="password" placeholder="Password"  value="" />
    <input id="domain" type="text"     placeholder="Domain"    value="" />
    <button type="submit">Connect</button>
    <button type="button" id="disconnect-btn">Disconnect</button>
  </form>
  <div id="status">Not connected</div>
  <canvas id="rdp-canvas" width="1280" height="720"></canvas>

  <script type="module">
    import init, { connect } from './pkg/rdp_wasm.js';

    const canvas  = document.getElementById('rdp-canvas');
    const ctx     = canvas.getContext('2d');
    let controller = null;

    await init();

    // Draw a bitmap update from the server.
    // bpp is bits-per-pixel; data is a Uint8Array in RGB(A) order.
    function onBitmap(x, y, w, h, bpp, data) {
      const imageData = ctx.createImageData(w, h);
      const pixels    = imageData.data;
      const bytesPerPx = bpp === 32 ? 4 : bpp === 24 ? 3 : 2;

      for (let i = 0; i < w * h; i++) {
        const src = i * bytesPerPx;
        let r, g, b;
        if (bpp === 32 || bpp === 24) {
          b = data[src]; g = data[src + 1]; r = data[src + 2];
        } else {
          // 16-bpp RGB565
          const px = data[src] | (data[src + 1] << 8);
          r = ((px >> 11) & 0x1F) << 3;
          g = ((px >>  5) & 0x3F) << 2;
          b =  (px        & 0x1F) << 3;
        }
        pixels[i * 4]     = r;
        pixels[i * 4 + 1] = g;
        pixels[i * 4 + 2] = b;
        pixels[i * 4 + 3] = 255;
      }
      ctx.putImageData(imageData, x, y);
    }

    const statusEl = document.getElementById('status');

    document.getElementById('connect-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const host   = document.getElementById('host').value;
      const port   = document.getElementById('port').value;
      const user   = document.getElementById('user').value;
      const pass   = document.getElementById('pass').value;
      const domain = document.getElementById('domain').value;
      const target = `${host}:${port}`;
      const wsUrl  = `ws://${location.host}/ws?target=${encodeURIComponent(target)}`;
      const width  = canvas.width;
      const height = canvas.height;

      statusEl.textContent = 'Connecting…';
      statusEl.className = '';

      try {
        controller = await connect(wsUrl, domain, user, pass, width, height, onBitmap);
        statusEl.textContent = 'Connected';
        statusEl.className = 'ok';
        console.log('RDP session started');
      } catch (err) {
        const msg = 'Connection failed: ' + err;
        statusEl.textContent = msg;
        statusEl.className = 'error';
        console.error('RDP connect failed:', err);
      }
    });

    document.getElementById('disconnect-btn').addEventListener('click', () => {
      controller = null;
    });

    // Keyboard input
    canvas.addEventListener('keydown', (e) => {
      if (!controller) return;
      e.preventDefault();
      controller.key_down(0, e.keyCode & 0xFF);
    });
    canvas.addEventListener('keyup', (e) => {
      if (!controller) return;
      e.preventDefault();
      controller.key_up(e.keyCode & 0xFF);
    });

    // Mouse input
    canvas.setAttribute('tabindex', '0');
    canvas.addEventListener('mousemove', (e) => {
      if (!controller) return;
      const rect = canvas.getBoundingClientRect();
      controller.mouse_move(e.clientX - rect.left, e.clientY - rect.top);
    });
    canvas.addEventListener('mousedown', (e) => {
      if (!controller) return;
      canvas.focus();
      const rect = canvas.getBoundingClientRect();
      const btn  = e.button === 0 ? 1 : e.button === 1 ? 3 : 2;
      controller.mouse_button(btn, true, e.clientX - rect.left, e.clientY - rect.top);
    });
    canvas.addEventListener('mouseup', (e) => {
      if (!controller) return;
      const rect = canvas.getBoundingClientRect();
      const btn  = e.button === 0 ? 1 : e.button === 1 ? 3 : 2;
      controller.mouse_button(btn, false, e.clientX - rect.left, e.clientY - rect.top);
    });
    canvas.addEventListener('wheel', (e) => {
      if (!controller) return;
      e.preventDefault();
      controller.mouse_wheel(e.deltaY > 0 ? -120 : 120);
    }, { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
