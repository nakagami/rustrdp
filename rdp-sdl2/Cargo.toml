[package]
name = "rdp-sdl2"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rdp-sdl2"
path = "src/main.rs"

[dependencies]
rdp-core = { path = "../rdp-core" }
tokio = { version = "1", features = ["full"] }
sdl2 = { version = "0.35", features = ["ttf", "unsafe_textures"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
thiserror = "1"
async-trait = "0.1"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

