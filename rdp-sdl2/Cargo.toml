[package]
name = "rdp-sdl2"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rdp-sdl2"
path = "src/main.rs"

[dependencies]
rdp-core = { path = "../rdp-core" }
tokio = { version = "1", features = ["full"] }
sdl2 = { version = "0.35", features = ["ttf"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
thiserror = "1"
async-trait = "0.1"

